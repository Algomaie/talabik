name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: talbak_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d talbak_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:ci-local-only@localhost:5432/talbak_test
      TEST_DATABASE_URL: postgresql://test:ci-local-only@localhost:5432/talbak_test
      TEST_REDIS_URL: redis://localhost:6379
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-access-only-not-a-production-secret
      JWT_REFRESH_SECRET: ci-test-refresh-only-not-a-production-secret
      ALLOW_DEMO_SEED: 'true'
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run migrate
      - run: npm run seed
      - run: npm run test:integration
